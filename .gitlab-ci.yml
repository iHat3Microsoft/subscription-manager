# CI: cheap correctness checks on every push.
# No deploy jobs here — deploys happen on the server itself via
# ops/subman-deploy.sh (forced command in authorized_keys).

stages:
  - test

node-syntax:
  stage: test
  image: node:20-alpine
  script:
    - node --check src/build.js
    - node --check src/parsers.js

bash-syntax:
  stage: test
  image: bash:5
  script:
    - for f in *.sh sync.bash ops/*.sh; do echo "bash -n $f"; bash -n "$f"; done

yaml-validate:
  stage: test
  image: node:20-alpine
  script:
    - npm ci --omit=dev
    - node -e "const fs=require('fs'),yaml=require('js-yaml');yaml.load(fs.readFileSync('my-rules.yaml','utf8'));console.log('my-rules.yaml: valid YAML')"
