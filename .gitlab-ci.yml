stages:
  - test
  - deploy

node-syntax:
  stage: test
  image: node:20-alpine
  interruptible: true
  script:
    - node --check src/build.js
    - node --check src/parsers.js
    - node tests/test_parsers.js

bash-syntax:
  stage: test
  image: bash:5
  interruptible: true
  script:
    - for f in *.sh sync.bash ops/*.sh tests/*.sh; do echo "bash -n $f"; bash -n "$f"; done
    - bash tests/test_shell_helpers.sh

yaml-validate:
  stage: test
  image: node:20-alpine
  interruptible: true
  script:
    - npm ci --omit=dev
    - >-
      node -e "const fs=require('fs'),yaml=require('js-yaml');yaml.load(fs.readFileSync('my-rules.yaml','utf8'));console.log('my-rules.yaml OK')"

deploy:production:
  stage: deploy
  image: alpine:latest
  needs: [node-syntax, bash-syntax, yaml-validate]
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - |
      if [ -z "${DEPLOY_HOST:-}" ]; then
        echo "ERROR: DEPLOY_HOST is not set in GitLab CI/CD Variables!" >&2
        echo "Go to Settings -> CI/CD -> Variables and set DEPLOY_HOST (IP or domain of server)" >&2
        exit 1
      fi
    - |
      if [ -n "${DEPLOY_SSH_KEY:-}" ] && [ -f "${DEPLOY_SSH_KEY:-}" ]; then
        chmod 600 "$DEPLOY_SSH_KEY"
        ssh-add "$DEPLOY_SSH_KEY"
      elif [ -n "${DEPLOY_SSH_KEY:-}" ]; then
        echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
      elif [ -n "${SSH_PRIVATE_KEY:-}" ] && [ -f "${SSH_PRIVATE_KEY:-}" ]; then
        chmod 600 "$SSH_PRIVATE_KEY"
        ssh-add "$SSH_PRIVATE_KEY"
      elif [ -n "${SSH_PRIVATE_KEY:-}" ]; then
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      else
        echo "ERROR: DEPLOY_SSH_KEY is not set in GitLab CI/CD Variables!" >&2
        exit 1
      fi
    - ssh-add -l
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - rsync -avz -e "ssh -p ${DEPLOY_PORT:-22} -o StrictHostKeyChecking=accept-new" src/build.js src/parsers.js "${DEPLOY_USER:-deploy-bot}@${DEPLOY_HOST}:${DEPLOY_PATH:-/opt/subscription-manager}/src/"
    - ssh -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=accept-new "${DEPLOY_USER:-deploy-bot}@${DEPLOY_HOST}" "node src/build.js"
