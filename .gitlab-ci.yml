# =============================================================================
# subscription-manager — GitLab CI
#
# СОСТОЯНИЕ: ВЫКЛЮЧЕНО. На push / merge request пайплайн вообще не создаётся:
# workflow-гейт ниже пропускает только ручной запуск (Run pipeline).
# Полностью закомментировать файл нельзя — пустой .gitlab-ci.yml GitLab
# считает невалидным и на каждый пуш показывает красный "invalid config",
# поэтому здесь живёт джоба-заглушка placeholder.
#
# КАК ВКЛЮЧИТЬ (3 шага):
#   1) удали блок GATE: workflow-правила и джобу placeholder ниже;
#   2) раскомментируй весь блок PIPELINE (убери ведущие "# ");
#   3) для деплой-джобы пропиши CI/CD-переменные (Settings > CI/CD >
#      Variables); тестовым джобам переменные не нужны:
#        SSH_PRIVATE_KEY  тип File   — приватный ключ deploy-пользователя
#        SSH_KNOWN_HOSTS  тип File   — вывод: ssh-keyscan -p <port> <host>
#        DEPLOY_HOST               — например sub.k3k.lol
#        DEPLOY_USER               — deploy-bot
#        DEPLOY_PORT  (опционально) — 22
#        BASE_URL    (опционально)  — https://sub.k3k.lol (для environment)
#      Сервер: deploy-bot + forced command /usr/local/bin/subman-deploy.sh
#      (README, ops/setup-deploy-bot.sh). Переменные с ключами пометь
#      Protected и сделай ветку master Protected.
#
# Что делает включённый пайплайн:
#   test    — синтаксис node + регрессия парсеров, bash -n + тесты хелперов,
#             валидация my-rules.yaml (его получают клиенты);
#   deploy  — ТОЛЬКО ручной (when: manual) запуск из ветки по умолчанию,
#             ssh forced command subman-deploy.sh, resource_group против
#             параллельных деплоев, known_hosts из переменной (без
#             StrictHostKeyChecking=no).
# =============================================================================

# --- GATE: удалить при включении ---------------------------------------------
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

placeholder:
  script:
    - echo "CI отключён: пайплайн запущен вручную через Run pipeline."
    - echo "Как включить настоящий пайплайн — см. комментарий вверху .gitlab-ci.yml"
# -----------------------------------------------------------------------------

