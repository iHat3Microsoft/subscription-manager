<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подключение VPN</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e58e0a'><rect width='24' height='24' fill='%23090909'/><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z' fill='%23e58e0a'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deepest: #090909;
            --bg-darker: #0d0d0d;
            --bg-main: #121212;
            --bg-surface: #161616;
            --bg-card: #1a1a1a;
            --bg-elevated: #1e1e1e;

            --state-hover: #222222;
            --state-active: #2a2a2a;

            --border-subtle: #181818;
            --border-default: #222222;
            --border-strong: #333333;

            --text-primary: #ebebeb;
            --text-contrast: #ffffff;
            --text-secondary: #bebebe;
            --text-muted: #8d939e;
            --text-disabled: #555555;

            --accent-primary: #e58e0a;
            --accent-hover: #f59e0b;
            --accent-bright: #fbbf24;
            --accent-surface: #3d2403;
            --accent-fg: #0a0a0a;

            --status-success: #9ece6a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0px !important;
            box-shadow: none !important;
            text-shadow: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-deepest);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 16px 64px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            padding: 30px 24px;
            text-align: center;
        }

        .logo-wrapper {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper svg {
            width: 26px;
            height: 26px;
            fill: var(--accent-primary);
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-contrast);
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .os-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 5px 12px;
            margin-bottom: 22px;
            border: 1px solid var(--border-default);
        }

        .os-badge .dot {
            width: 5px;
            height: 5px;
            background: var(--accent-primary);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 16px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--accent-fg);
            border-color: var(--accent-primary);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .btn-primary:active {
            background: var(--accent-bright);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-color: var(--border-default);
        }

        .btn-secondary:hover {
            background: var(--state-hover);
            border-color: var(--border-strong);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .section-divider {
            position: relative;
            text-align: center;
            margin: 22px 0 14px;
        }

        .section-divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-subtle);
        }

        .section-divider span {
            position: relative;
            background: var(--bg-card);
            padding: 0 10px;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .platform-tabs {
            display: flex;
            background: var(--bg-surface);
            padding: 2px;
            margin-bottom: 12px;
            gap: 2px;
            border: 1px solid var(--border-subtle);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 7px 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: var(--bg-card);
            color: var(--accent-primary);
            border-color: var(--border-default);
        }

        .app-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .app-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            background: var(--bg-surface);
            border: 1px solid var(--border-default);
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.15s ease;
        }

        .app-item:hover {
            background: var(--state-hover);
            border-color: var(--border-strong);
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .app-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-contrast);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .app-tag {
            font-size: 10px;
            background: var(--accent-surface);
            color: var(--accent-hover);
            padding: 1px 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 1px solid rgba(229, 142, 10, 0.3);
        }

        .app-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        .app-arrow svg {
            width: 14px;
            height: 14px;
            fill: var(--text-muted);
            transition: transform 0.15s ease;
        }

        .app-item:hover .app-arrow svg {
            fill: var(--text-primary);
            transform: translateX(2px);
        }

        .other-apps-wrapper {
            margin-top: 4px;
            text-align: left;
        }

        details.other-apps {
            border: 1px solid var(--border-subtle);
            background: var(--bg-darker);
        }

        details.other-apps summary {
            padding: 9px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        details.other-apps summary::-webkit-details-marker {
            display: none;
        }

        details.other-apps summary::after {
            content: "+";
            font-size: 13px;
            color: var(--text-muted);
        }

        details.other-apps[open] summary::after {
            content: "−";
        }

        .other-apps-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            border-top: 1px solid var(--border-subtle);
        }

        .other-app-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 12px;
            transition: all 0.12s ease;
        }

        .other-app-item:hover {
            color: var(--text-contrast);
            border-color: var(--border-strong);
            background: var(--state-hover);
        }

        .other-app-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        .steps {
            text-align: left;
            margin-top: 18px;
            background: var(--bg-surface);
            padding: 14px;
            font-size: 12px;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        .step-item {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .step-item:last-child {
            margin-bottom: 0;
        }

        .step-num {
            width: 17px;
            height: 17px;
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
            </div>

            <h1 class="title" id="page-title">Подключение VPN</h1>
            <p class="subtitle">Импортируйте профиль подписки в ваше приложение в один клик.</p>

            <div id="detected-os" class="os-badge">
                <span class="dot"></span>
                <span id="os-text">Определяем систему...</span>
            </div>

            <div class="actions">
                <a id="btn-import" class="btn btn-primary" href="#">
                    <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
                    <span>Подключить в приложение</span>
                </a>

                <button id="btn-copy" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    <span>Скопировать ссылку</span>
                </button>
            </div>

            <div class="section-divider">
                <span>Скачать приложение</span>
            </div>

            <div class="platform-tabs">
                <button class="tab-btn" data-target="android">Android</button>
                <button class="tab-btn" data-target="windows">Windows</button>
                <button class="tab-btn" data-target="ios">iOS</button>
                <button class="tab-btn" data-target="macos">macOS</button>
                <button class="tab-btn" data-target="linux">Linux</button>
            </div>

            <div id="app-container" class="app-list"></div>

            <div id="other-apps-container" class="other-apps-wrapper"></div>

            <div class="steps" id="steps-container"></div>
        </div>
    </div>

    <script>
        (function() {
            const subUrl = window.location.href;
            const cleanSubUrl = subUrl.split('#')[0];

            const urlParams = new URLSearchParams(window.location.search);
            const hostParts = window.location.hostname.split('.');
            let dynamicName = 'VPN';
            if (urlParams.get('name')) {
                dynamicName = urlParams.get('name');
            } else if (hostParts.length >= 2) {
                const baseDomain = hostParts.slice(-2).join('.').toLowerCase();
                if (baseDomain && baseDomain !== 'localhost') {
                    dynamicName = baseDomain + ' VPN';
                }
            }

            document.title = 'Подключение ' + dynamicName;
            document.getElementById('page-title').innerText = 'Подключение ' + dynamicName;

            const importBtn = document.getElementById('btn-import');
            importBtn.href = 'clash://install-config?url=' + encodeURIComponent(cleanSubUrl) + '&name=' + encodeURIComponent(dynamicName);

            const copyBtn = document.getElementById('btn-copy');
            copyBtn.addEventListener('click', function() {
                navigator.clipboard.writeText(cleanSubUrl).then(() => {
                    const span = copyBtn.querySelector('span');
                    const orig = span.innerText;
                    span.innerText = 'Ссылка скопирована';
                    copyBtn.style.borderColor = 'var(--status-success)';
                    setTimeout(() => {
                        span.innerText = orig;
                        copyBtn.style.borderColor = '';
                    }, 2000);
                });
            });

            const appsData = {
                android: {
                    main: [
                        {
                            name: 'Clash Meta for Android',
                            tag: 'Рекомендуем',
                            desc: 'Установка через F-Droid (автообновления)',
                            url: 'https://f-droid.org/packages/com.github.metacubex.clash.meta/'
                        },
                        {
                            name: 'Clash Meta for Android (GitHub)',
                            tag: 'APK',
                            desc: 'Прямая загрузка APK с GitHub Releases',
                            url: 'https://github.com/MetaCubeX/ClashMetaForAndroid/releases/latest'
                        },
                        {
                            name: 'FlClash',
                            tag: '',
                            desc: 'Кроссплатформенный клиент с легким интерфейсом',
                            url: 'https://github.com/chen08209/FlClash/releases/latest'
                        }
                    ],
                    others: [
                        { name: 'FlClashX', desc: 'Форк FlClash', url: 'https://github.com/pluralplay/FlClashX/releases' },
                        { name: 'Clash Mi', desc: 'Альтернативный клиент', url: 'https://github.com/KaringX/clashmi' }
                    ],
                    steps: [
                        'Установите клиент.',
                        'Нажмите «Подключить в приложение» (или скопируйте ссылку).',
                        'Разрешите добавление VPN-профиля и включите переключатель.'
                    ]
                },
                windows: {
                    main: [
                        {
                            name: 'FlClash',
                            tag: 'Рекомендуем',
                            desc: 'Легковесный клиент для Windows (x64)',
                            url: 'https://github.com/chen08209/FlClash/releases/latest'
                        },
                        {
                            name: 'Clash Verge Rev',
                            tag: 'Рекомендуем',
                            desc: 'Быстрые обновления ядра, поддержка всех протоколов',
                            url: 'https://github.com/clash-verge-rev/clash-verge-rev/releases/latest'
                        }
                    ],
                    others: [
                        { name: 'FlClashX', desc: 'Форк FlClash с улучшениями', url: 'https://github.com/pluralplay/FlClashX/releases' },
                        { name: 'Prizrak-Box', desc: 'Сборка от Legiz', url: 'https://github.com/legiz-ru/Prizrak-Box/releases' },
                        { name: 'Koala Clash', desc: 'Форк Clash Verge Lite', url: 'https://github.com/coolcoala/clash-verge-rev-lite' },
                        { name: 'Clash Mi', desc: 'Клиент на базе Mihomo', url: 'https://github.com/KaringX/clashmi' }
                    ],
                    steps: [
                        'Установите клиент.',
                        'Нажмите «Подключить в приложение».',
                        'Включите системный прокси (System Proxy) или режим TUN.'
                    ]
                },
                macos: {
                    main: [
                        {
                            name: 'Clash Verge Rev',
                            tag: 'Рекомендуем',
                            desc: 'Поддержка Apple Silicon (M-серия) и Intel',
                            url: 'https://github.com/clash-verge-rev/clash-verge-rev/releases/latest'
                        },
                        {
                            name: 'FlClash',
                            tag: 'Рекомендуем',
                            desc: 'Легкий кроссплатформенный клиент (.dmg)',
                            url: 'https://github.com/chen08209/FlClash/releases/latest'
                        }
                    ],
                    others: [
                        { name: 'Prizrak-Box', desc: 'Сборка от Legiz', url: 'https://github.com/legiz-ru/Prizrak-Box/releases' },
                        { name: 'Koala Clash', desc: 'Форк Clash Verge Lite', url: 'https://github.com/coolcoala/clash-verge-rev-lite' },
                        { name: 'FlClashX', desc: 'Форк FlClash', url: 'https://github.com/pluralplay/FlClashX/releases' }
                    ],
                    steps: [
                        'Установите клиент.',
                        'Нажмите «Подключить в приложение» и разрешите Helper Tool.',
                        'Активируйте системный прокси в интерфейсе приложения.'
                    ]
                },
                linux: {
                    main: [
                        {
                            name: 'Clash Verge Rev',
                            tag: 'Рекомендуем',
                            desc: 'AppImage / DEB / RPM пакеты для Linux',
                            url: 'https://github.com/clash-verge-rev/clash-verge-rev/releases/latest'
                        },
                        {
                            name: 'FlClash',
                            tag: '',
                            desc: 'AppImage / Tar.gz архив',
                            url: 'https://github.com/chen08209/FlClash/releases/latest'
                        }
                    ],
                    others: [
                        { name: 'AUR: mihomo-bin', desc: 'cli версия без гуи (yay -S mihomo-bin)', url: 'https://aur.archlinux.org/packages/mihomo-bin' },
                        { name: 'Prizrak-Box', desc: 'Сборка от Legiz', url: 'https://github.com/legiz-ru/Prizrak-Box/releases' },
                        { name: 'FlClashX', desc: 'Форк FlClash', url: 'https://github.com/pluralplay/FlClashX/releases' }
                    ],
                    steps: [
                        'Установите клиент.',
                        'Импортируйте ссылку подписки в клиент.',
                        'В клиенте включите режим TUN, оставьте System Proxy выключенным.'
                    ]
                },
                ios: {
                    main: [
                        {
                            name: 'Clash Mi',
                            tag: 'App Store',
                            desc: 'Бесплатный Mihomo-клиент в российском App Store',
                            url: 'https://apps.apple.com/ru/app/clash-mi/id6744321968'
                        },
                        {
                            name: 'Rabbit Hole',
                            tag: 'App Store',
                            desc: 'Бесплатный чистый Mihomo-клиент в App Store',
                            url: 'https://apps.apple.com/us/app/rabbithole-vpn-client/id6683309629'
                        }
                    ],
                    others: [],
                    steps: [
                        'Установите клиент.',
                        'Нажмите «Подключить в приложение».',
                        'Разрешите добавление VPN-конфигурации в настройках iOS.'
                    ]
                }
            };

            function detectOS() {
                const ua = navigator.userAgent.toLowerCase();
                if (/iphone|ipad|ipod/.test(ua)) return 'ios';
                if (/android/.test(ua)) return 'android';
                if (/win/.test(ua)) return 'windows';
                if (/mac/.test(ua)) return 'macos';
                if (/linux/.test(ua)) return 'linux';
                return 'android';
            }

            const currentOS = detectOS();
            const osNames = {
                android: 'Android',
                windows: 'Windows',
                macos: 'macOS',
                ios: 'iOS',
                linux: 'Linux'
            };

            document.getElementById('os-text').innerText = 'Система: ' + (osNames[currentOS] || 'Android');

            function renderPlatform(platform) {
                const data = appsData[platform] || appsData.android;
                
                const appContainer = document.getElementById('app-container');
                appContainer.innerHTML = data.main.map(app => `
                    <a class="app-item" href="${app.url}" target="_blank" rel="noopener">
                        <div class="app-info">
                            <div class="app-name">
                                ${app.name}
                                ${app.tag ? `<span class="app-tag">${app.tag}</span>` : ''}
                            </div>
                            <div class="app-desc">${app.desc}</div>
                        </div>
                        <div class="app-arrow">
                            <svg viewBox="0 0 24 24"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42L16.86 11H5v2z"/></svg>
                        </div>
                    </a>
                `).join('');

                const otherContainer = document.getElementById('other-apps-container');
                if (data.others && data.others.length > 0) {
                    otherContainer.innerHTML = `
                        <details class="other-apps">
                            <summary>Другие клиенты (${data.others.length})</summary>
                            <div class="other-apps-content">
                                ${data.others.map(o => `
                                    <a class="other-app-item" href="${o.url}" target="_blank" rel="noopener">
                                        <span>${o.name}</span>
                                        <span class="other-app-desc">${o.desc}</span>
                                    </a>
                                `).join('')}
                            </div>
                        </details>
                    `;
                } else {
                    otherContainer.innerHTML = '';
                }

                const stepsContainer = document.getElementById('steps-container');
                stepsContainer.innerHTML = data.steps.map((step, idx) => `
                    <div class="step-item">
                        <div class="step-num">${idx + 1}</div>
                        <div>${step}</div>
                    </div>
                `).join('');

                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.target === platform);
                });
            }

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    renderPlatform(btn.dataset.target);
                });
            });

            renderPlatform(currentOS);
        })();
    </script>
</body>
</html>
