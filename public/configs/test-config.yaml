sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
proxies: []
proxy-groups:
  - name: 📊 Smart
    type: smart
    hidden: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    uselightgbm: true
    collectdata: false
    strategy: sticky-sessions
    sample-rate: 1
    use:
      - foreign_servers
  - name: ⚡️ Fastest
    type: url-test
    hidden: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    use:
      - foreign_servers
  - name: ♻️ Автовыбор (Иностранные)
    type: fallback
    hidden: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    use:
      - foreign_servers
  - name: ♻️ Автовыбор (Россия)
    type: fallback
    hidden: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    use:
      - ru_servers
  - name: ♻️ Резерв (RU -> EU)
    type: fallback
    hidden: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    use:
      - ru_servers
      - foreign_servers
  - name: 🌍 Иностранные серверы
    type: select
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
    proxies:
      - 📊 Smart
      - ⚡️ Fastest
      - ♻️ Автовыбор (Иностранные)
      - 🇷🇺 Российские серверы
      - DIRECT
    use:
      - foreign_servers
      - ru_servers
  - name: 🚫 Заблокированные сайты (RU)
    type: select
    icon: https://raw.githubusercontent.com/remnawave/templates/refs/heads/main/icons/Blocked.png
